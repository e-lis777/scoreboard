<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Легион — Larix</title><link rel="stylesheet" href="./src/larix.css"></head>
<body><main class="stage">
  <div class="glow glow-a"></div><div class="glow glow-b"></div><div class="grain"></div>
  <header><div id="competition" class="competition"></div><div id="connection" class="connection" hidden>ВОССТАНАВЛИВАЕМ СВЯЗЬ…</div></header>
  <section class="content">
    <div id="status" class="status">ЗАГРУЖАЕМ МАТЧ…</div>
    <div class="teams">
      <article class="team"><div class="crest"><img id="home-logo" alt="Легион"></div><h1 id="home-name">ЛЕГИОН</h1></article>
      <div class="middle"><div class="versus">VS</div><div class="score"><b id="home-score">0</b><span>:</span><b id="away-score">0</b></div><div id="period" class="period"></div></div>
      <article class="team"><div class="crest"><img id="away-logo" alt="Соперник"></div><h1 id="away-name">СОПЕРНИК</h1></article>
    </div>
    <div id="countdown" class="countdown" hidden></div>
    <div id="substatus" class="substatus"></div>
  </section>
  <footer><div id="match-date"></div><div id="venue"></div></footer>
</main><script type="module" src="./src/larix-screen.js"></script></body></html>
